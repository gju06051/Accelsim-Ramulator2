# HBM3 + SID 8-channel Ramulator2 config for AccelSim 1-stack runs.
#
# AccelSim memory partition ids are passed to Ramulator2 as Request::source_id.
# ExternalChannelRoBaRaCoCh uses that source_id as the channel, then maps the
# lower address bits across pseudochannel, SID, bankgroup, bank, row, column.

Frontend:
  impl: GEM5
  clock_ratio: 8

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 3

  DRAM:
    impl: HBM3SID
    org:
      preset: HBM3SID_8Gb
      channel_width: 128
      channel: 8
    timing:
      preset: HBM3SID_6.4Gbps

  Controller:
    impl: Generic
    read_buffer_size: 64
    write_buffer_size: 64
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: OpenRowPolicy
    plugins:

  AddrMapper:
    impl: ExternalChannelRoBaRaCoCh
