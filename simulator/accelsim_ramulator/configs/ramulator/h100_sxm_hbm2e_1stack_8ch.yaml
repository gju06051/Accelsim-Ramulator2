# H100 SXM core/L2 geometry with an HBM2e-style one-stack memory backend.
#
# AccelSim still exposes the H100 1/5-stack geometry with 16 memory partitions.
# This Ramulator2 config folds those 16 source ids onto 8 physical HBM2e-style
# 128-bit channels, matching the usual one-stack HBM2e 1024-bit interface.
# The HBM2 model is used as the local HBM2e timing carrier at 3.2Gbps/pin.

Frontend:
  impl: GEM5
  clock_ratio: 8

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 3

  DRAM:
    impl: HBM2
    org:
      preset: HBM2_8Gb
      density: 16384
      channel_width: 128
      channel: 8
      row: 65536
    timing:
      rate: 3200
      nBL: 4
      tCL: 7.5
      tRCDRD: 7.5
      tRCDWR: 7.5
      tRP: 7.5
      tRAS: 17.0
      tRC: 19.0
      tWR: 8.0
      tRTPS: 2.0
      tRTPL: 3.0
      tCWL: 2.0
      nCCDS: 1
      nCCDL: 2
      tRRDS: 2.0
      tRRDL: 3.0
      tWTRS: 3.0
      tWTRL: 4.0
      tRTW: 3.0
      tFAW: 15.0
      tRFCSB: 160.0
      tREFI: 3900.0
      tREFISB: 2438.0
      tRREFD: 8.0

  Controller:
    impl: Generic
    read_buffer_size: 64
    write_buffer_size: 64
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: OpenRowPolicy
    plugins:

  AddrMapper:
    impl: ExternalChannelModuloRoBaRaCoCh
    channel_start_bit: 8
