# H100 SXM-style HBM3 + SID Ramulator2 config for direct AccelSim mapping.
#
# This models the physical memory interface as:
#   5 stacks * 16 channels/stack * 64 bits/channel = 5120 bits
#
# Pair this with configs/accelsim/h100_sxm_hbm3_80ch.config, which exposes 80
# AccelSim memory partitions. ExternalChannelRoBaRaCoCh maps each AccelSim
# partition/source_id directly to the matching Ramulator2 channel.

Frontend:
  impl: GEM5
  clock_ratio: 8

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 3

  DRAM:
    impl: HBM3SID
    org:
      preset: HBM3SID_8Gb
      channel_width: 64
      channel: 80
    timing:
      preset: HBM3SID_H100_SXM_5.234Gbps

  Controller:
    impl: Generic
    read_buffer_size: 64
    write_buffer_size: 64
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: OpenRowPolicy
    plugins:

  AddrMapper:
    impl: ExternalChannelRoBaRaCoCh
