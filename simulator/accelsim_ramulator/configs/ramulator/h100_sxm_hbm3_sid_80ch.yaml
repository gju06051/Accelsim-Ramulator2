# H100 SXM-style HBM3 + SID Ramulator2 config for direct AccelSim mapping.
#
# This models a 5-stack Samsung-style HBM3 memory interface under H100 geometry as:
#   5 stacks * 16 physical channels/stack * 64 bits/channel = 5120 bits
#   64-bit channel = 2 pseudochannels * 32-bit DQ
#   16GB/stack = 16Gb dies in an 8-high, two-SID stack
#   per-PC column access = 256b DQ = 32B, page = 1KB
#   Samsung paper frequency = 8Gb/s/pin = 5120GB/s across 5 stacks
#
# Pair this with configs/accelsim/h100_sxm_hbm3_80ch.config, which exposes 80
# AccelSim memory partitions. ExternalChannelRoBaRaCoCh maps each AccelSim
# partition/source_id directly to the matching Ramulator2 channel.

Frontend:
  impl: GEM5
  clock_ratio: 8

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 3

  DRAM:
    impl: HBM3SID
    org:
      preset: HBM3SID_8Gb_2SID_16Gb_8Hi
      # Ramulator uses the selected pseudochannel's DQ width here.
      channel_width: 32
      channel: 80
    timing:
      preset: HBM3SID_SAMSUNG_8Gbps

  Controller:
    impl: Generic
    # Match official AccelSim SM80_A100 -gpgpu_frfcfs_dram_sched_queue_size.
    read_buffer_size: 64
    write_buffer_size: 64
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: OpenRowPolicy
    plugins:

  AddrMapper:
    impl: ExternalChannelRoBaRaCoCh
    channel_start_bit: 8
