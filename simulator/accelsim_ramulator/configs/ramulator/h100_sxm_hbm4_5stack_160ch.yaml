# H100 SXM core/L2 geometry with a five-stack HBM4-style memory backend.
#
# AccelSim keeps the H100 full geometry with 80 memory partitions. HBM4 can
# expose 32 channels/stack, so five stacks provide 160 physical channels; each
# AccelSim source id selects a two-channel group at 32B granularity.
# This uses the conventional HBM4 baseline from the SPIRE-HBM paper:
# 32b pseudochannels, 4 SIDs / 16Hi, 2 bank groups, 8 banks, 1KB rows,
# 8Gbps/pin, FR-FCFS, open-row, all-bank refresh, and 64-entry queues per pCH.

Frontend:
  impl: GEM5
  clock_ratio: 8

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 3

  DRAM:
    impl: HBM4
    org:
      preset: HBM4_32Gb_16Hi
      channel_width: 32
      channel: 160
    timing:
      preset: HBM4_8000Mbps

  Controller:
    impl: Generic
    read_buffer_size: 64
    write_buffer_size: 64
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: OpenRowPolicy
    plugins:

  AddrMapper:
    impl: ExternalChannelGroupRoBaRaCoCh
    channels_per_source: 2
    split_granularity_bytes: 32
    channel_start_bit: 8
