# A100 HBM2e-style 1-stack smoke config.
#
# This is the same per-channel organization/timing as a100_hbm2e_80gb.yaml but
# exposes 8 channels so it lines up with --config-variant a100_1stack. Use it
# for quick smoke tests before running the full 40-partition A100 config.

Frontend:
  impl: GEM5
  clock_ratio: 8

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 3

  DRAM:
    impl: HBM2
    org:
      preset: HBM2_8Gb
      density: 16384
      channel_width: 128
      channel: 8
      row: 65536
    timing:
      rate: 3200
      nBL: 4
      tCL: 7.5
      tRCDRD: 7.5
      tRCDWR: 7.5
      tRP: 7.5
      tRAS: 17.0
      tRC: 19.0
      tWR: 8.0
      tRTPS: 2.0
      tRTPL: 3.0
      tCWL: 2.0
      nCCDS: 1
      nCCDL: 2
      tRRDS: 2.0
      tRRDL: 3.0
      tWTRS: 3.0
      tWTRL: 4.0
      tRTW: 3.0
      tFAW: 15.0
      tRFCSB: 160.0
      tREFI: 3900.0
      tREFISB: 2438.0
      tRREFD: 8.0

  Controller:
    impl: Generic
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: OpenRowPolicy
    plugins:

  AddrMapper:
    impl: ExternalChannelRoBaRaCoCh
