Frontend:
  impl: SimpleO3
  clock_ratio: 8
  num_expected_insts: 8
  traces:
    - example_hbm4_sid_ccdr.inst

  Translation:
    impl: NoTranslation
    max_addr: 2147483648

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 3

  DRAM:
    impl: HBM4
    org:
      preset: HBM4_8Gb
      channel_width: 32
      channel: 1
    timing:
      preset: HBM4_4Gbps

  Controller:
    impl: Generic
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: OpenRowPolicy
    plugins:
      - ControllerPlugin:
          impl: TraceRecorder
          path: ./build/hbm4_sid_ccdr.cmdtrace
      - ControllerPlugin:
          impl: CommandCounter
          path: ./build/hbm4_sid_ccdr.cmdcount
          commands_to_count:
            - ACT
            - RD
            - WR
            - PRE

  AddrMapper:
    impl: RoBaRaCoCh
