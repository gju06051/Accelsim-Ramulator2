Frontend:
  impl: LoadStoreTrace
  clock_ratio: 1
  path: example_sghbm_bank_sweep.ldst
  drain_cycles: 1000

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 1

  DRAM:
    impl: SGHBM
    org:
      preset: SGHBM_8Gb
      channel_width: 32
      channel: 1
    timing:
      preset: SGHBM_4Gbps
    sg:
      sector_size: A1024
      cmd_factor: 1

  Controller:
    impl: Generic
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: OpenRowPolicy
    plugins:
      - ControllerPlugin:
          impl: TraceRecorder
          path: ./build/sghbm_a1024_1xcmd.cmdtrace
      - ControllerPlugin:
          impl: CommandCounter
          path: ./build/sghbm_a1024_1xcmd.cmdcount
          commands_to_count:
            - ACT
            - RD
            - WR
            - PRE

  AddrMapper:
    impl: RoBaRaCoCh
