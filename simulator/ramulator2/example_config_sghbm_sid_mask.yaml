Frontend:
  impl: LoadStoreTrace
  clock_ratio: 1
  path: example_sghbm_sid_mask.ldst
  drain_cycles: 1000

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 1

  DRAM:
    impl: SGHBM
    org:
      preset: SGHBM_8Gb
      channel_width: 32
      channel: 1
    timing:
      preset: SGHBM_4Gbps
    sg:
      sector_size: A512
      cmd_factor: 2

  Controller:
    impl: Generic
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: OpenRowPolicy
    plugins:
      - ControllerPlugin:
          impl: SIDMaskCounter
          path: ./build/sghbm_sid_mask.csv

  AddrMapper:
    impl: RoBaRaCoCh
